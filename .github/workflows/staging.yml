name: Frame checks and staging deploy

on:
    push:
        branches: ['**']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    checks:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Set up PHP 8.3
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: none
              env:
                  update: 'true'

            - name: Verify patched PHP runtime on CI runner
              run: |
                  php -r 'if (version_compare(PHP_VERSION, "8.3.36", "<")) { fwrite(STDERR, "CI requires PHP 8.3.36 or newer\n"); exit(1); } echo "CI PHP: ", PHP_VERSION, "\n";'

            - name: Install dependencies
              run: npm ci

            - name: Lint, formatting and unit tests
              run: npm run check

            - name: Build assets
              run: npm run build

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Browser regression tests
              run: npm run test:browser

            - name: Save browser failure traces
              if: failure()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: browser-failures
                  path: test-results
                  if-no-files-found: ignore
                  retention-days: 3

            - name: Vite integration tests
              run: npm run test:dev

            - name: Verify required CSS and JS
              run: |
                  set -euo pipefail
                  test -s dist/css/style.min.css
                  test -s dist/js/app.min.js

            - name: Check theme PHP syntax
              run: |
                  set -euo pipefail
                  while IFS= read -r -d '' file; do
                    php -l "$file"
                  done < <(git ls-files -z -- '*.php')

            - name: Package runtime theme
              run: node build/scripts/package-theme.mjs "$RUNNER_TEMP/frame-package"

            - name: Save verified runtime package
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: frame-package
                  path: ${{ runner.temp }}/frame-package
                  if-no-files-found: error
                  retention-days: 3

    staging:
        needs: checks
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        environment: staging
        concurrency:
            group: frame-staging
            cancel-in-progress: false
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download verified runtime package
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: frame-package
                  path: ${{ runner.temp }}/frame-package

            - name: Deploy staging and verify remote files
              env:
                  FRAME_PACKAGE_DIR: ${{ runner.temp }}/frame-package
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_PORT: ${{ secrets.SSH_PORT }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
              run: bash build/scripts/staging-deploy.sh

            - name: Check staging availability and deployed CSS/JS
              run: |
                  set -euo pipefail
                  curl_options=(--silent --show-error --location --max-redirs 5
                    --connect-timeout 15 --max-time 60 --retry 2
                    --proto '=https' --proto-redir '=https')
                  homepage_status=$(curl "${curl_options[@]}" --output "$RUNNER_TEMP/staging-home.html" \
                    --write-out '%{http_code}' 'https://dnl.chipsa.ru/')
                  case "$homepage_status" in
                    2??) printf 'Staging homepage HTTP %s\n' "$homepage_status" ;;
                    401) echo 'Staging homepage HTTP 401: intentional authentication protection; application content not checked.' ;;
                    *) printf 'Unexpected staging homepage HTTP %s\n' "$homepage_status" >&2; exit 1 ;;
                  esac
                  for asset in css/style.min.css js/app.min.js; do
                    output="$RUNNER_TEMP/staging-$(basename "$asset")"
                    curl "${curl_options[@]}" --fail --output "$output" \
                      "https://dnl.chipsa.ru/wp-content/themes/frame/dist/$asset?frame_deploy=$GITHUB_SHA"
                    cmp -- "$output" "$RUNNER_TEMP/frame-package/dist/$asset"
                    printf 'Deployed asset verified over HTTPS: %s\n' "$asset"
                  done
                  echo 'HTTP availability does not confirm theme activation or visual correctness.'
